name: Wake Streamlit Apps

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:         # allows manual run from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: pip install selenium

      - name: Visit each app and click wake button if asleep
        env:
          # One app URL per line. To add an app, add a new line below.
          STREAMLIT_APP_URLS: |
            https://country-faceoff.streamlit.app/
            https://world-expo.streamlit.app/
            https://world-time-machine.streamlit.app/
            https://distance-showdown.streamlit.app/
            https://power-planner.streamlit.app/
            https://geoooo.streamlit.app/
        run: |
          python - <<'PY'
          import os, sys, time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          URLS = [u.strip() for u in os.environ["STREAMLIT_APP_URLS"].splitlines() if u.strip()]
          BTN = "//button[contains(text(),'Yes, get this app back up')]"
          failed = []

          for url in URLS:
              o = Options()
              for a in ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1920,1080"]:
                  o.add_argument(a)
              d = webdriver.Chrome(options=o)
              try:
                  d.get(url)
                  print("Opened", url)
                  try:
                      WebDriverWait(d, 15).until(EC.element_to_be_clickable((By.XPATH, BTN))).click()
                      print("  App was asleep - clicked wake button")
                      WebDriverWait(d, 20).until(EC.invisibility_of_element_located((By.XPATH, BTN)))
                  except TimeoutException:
                      print("  No wake button found - app already awake")
                  time.sleep(45)  # stay on page so the session counts as real traffic
                  print("  Done")
              except Exception as e:
                  print("  Error:", e)
                  failed.append(url)
              finally:
                  d.quit()

          if failed:
              print("FAILED:", failed)
              sys.exit(1)
          PY
